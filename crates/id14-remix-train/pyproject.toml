[project]
name = "id14-remix-train"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.1,<3",
  "onnx>=1.17,<2",
  "onnxruntime>=1.20,<2",
  "pyyaml>=6.0,<7",
  "soundfile>=0.13,<1",
  "torch>=2.6,<3",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<10"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["remix_train*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
