[package]
name = "id14-remix-ladspa"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tract-onnx = "=0.22.1"
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "alternative-backend", "api-24"] }
libloading = "=0.9.0"
serde_json = "1"
uuid = { version = "1", features = ["v7"] }

[features]
# Measurement only: reconstruct the previous guard for an A/B .so comparison.
comparison-legacy-guard = []
